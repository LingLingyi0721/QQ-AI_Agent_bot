onebot:
  ws_url: ws://127.0.0.1:3001
  access_token: ""
  reconnect_initial: 3
  reconnect_max: 30

llm:
  temperature: 0.7
  max_tokens: 1024
  timeout: 60
  reasoning_effort: ""   # 可选：low / medium / high，留空则不下发该参数
  history_turns: 8
  history_ttl_minutes: 60
  # 人设：显式指定优先，留空则按 model 名匹配 persona_map（小写包含匹配，长关键字优先）
  system_prompt_file: ""
  persona_dir: config/personas
  # 社区二创风格人格，非官方设定
  persona_map:
    deepseek: deepseek.txt
    claude: claude.txt
    gpt: gpt.txt
    o1: gpt.txt
    o3: gpt.txt
    gemini: gemini.txt
    qwen: qwen.txt
    tongyi: qwen.txt
    glm: glm.txt
    chatglm: glm.txt
    default: default.txt

reply:
  private_enabled: true
  group_enabled: true
  group_require_at: true
  command_prefix: "/ai "
  cooldown_seconds: 3
  max_reply_chars: 800
  error_reply: "（我这边暂时想不出话，等会儿再说）"
  whitelist_groups: []
  blacklist_users: []

storage:
  context_file: data/context.json
